<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>
    <style>
        :root {
            /* Light Mode */
            --page-bg: #b3b3b8;
            --bg-color: #f0f0f2;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #3a3a3c;
            --border-color: #c6c6c8;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --danger: #ff3b30;
            --shadow: 0 4px 6px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.15);
            --radius: 8px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="dark"] {
            /* Dark Mode */
            --page-bg: #000000;
            --bg-color: #151516;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #d1d1d6;
            --border-color: #38383a;
            --accent-blue: #0a84ff;
            --accent-blue-hover: #409cff;
            --danger: #ff453a;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }

        body {
            background-color: var(--page-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 15px;
            transition: background-color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 1450px;
            height: 95vh;
            background-color: var(--bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .info-box {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .info-sno { background-color: rgba(142, 142, 147, 0.15); color: var(--text-main); margin-right: 5px; }
        .info-cat { background-color: rgba(0, 113, 227, 0.12); color: var(--accent-blue); }
        .info-date { background-color: rgba(142, 142, 147, 0.12); color: var(--text-muted); }
        .info-amount { background-color: rgba(52, 199, 89, 0.12); color: #208736; font-size: 0.7rem; }
        [data-theme="dark"] .info-amount { color: #32d74b; background-color: rgba(52, 199, 89, 0.18); }

        /* Top Header Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px 12px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .top-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .metric-box { font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 4px; color: var(--text-main); }
        .top-right { display: flex; align-items: center; gap: 10px; }
        
        .time-display { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }

        button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
        }
        button:hover { background-color: var(--page-bg); }
        button.primary { background-color: var(--accent-blue); color: white; border: none; }
        button.primary:hover { background-color: var(--accent-blue-hover); }
        button.danger { background-color: transparent; color: var(--danger); border-color: var(--danger); }
        button.danger:hover { background-color: rgba(255,59,48,0.1); }
        
        .icon-btn { font-size: 1rem; padding: 4px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; height: auto; }
        .icon-btn:hover { background: transparent; transform: scale(1.1); }

        .main-content {
            display: flex;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
        }

        .left-panel {
            width: 380px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 5px;
        }

        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            transition: background-color 0.3s;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        
        .card-header {
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group { margin-bottom: 8px; width: 100%; }
        label { display: block; margin-bottom: 3px; color: var(--text-muted); font-weight: 600; font-size: 0.65rem; }
        input, select {
            width: 100%; padding: 7px 9px; border: 1px solid var(--border-color);
            border-radius: 5px; background-color: var(--bg-color); color: var(--text-main);
            font-size: 0.75rem; font-weight: 500; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.2); }
        input::placeholder { color: #8e8e93; font-weight: 400; }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }

        .item-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: var(--radius);
        }
        
        .form-actions { display: flex; justify-content: space-between; margin-top: 15px; flex-wrap: wrap; gap: 8px; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 8px; border-bottom: 1px solid var(--border-color); font-size: 0.75rem; font-weight: 500; }
        th { color: var(--text-muted); font-weight: 700; font-size: 0.65rem; text-transform: uppercase; background-color: var(--bg-color); position: sticky; top: 0; z-index: 1;}
        .item-list { list-style: none; }
        .desc-text { color: var(--text-muted); font-size: 0.7rem; font-weight: 500; }

        /* Godline Input */
        .godline-text { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-style: normal; 
            font-weight: 700; 
            color: var(--accent-blue); 
            font-size: 0.95rem;
        }
        [data-theme="dark"] .godline-text { color: #409cff; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <div class="metric-box">
                Sale: <span id="todayTotalValue" class="info-box info-amount">₹0.00</span>
                <button type="button" id="toggleSaleBtn" onclick="toggleTodaySale()" style="padding: 2px 6px; font-size: 0.65rem; height: auto;">Hide</button>
            </div>
            <div class="metric-box">
                Profit: <span id="todayProfitValue" class="info-box" style="background-color: rgba(52, 199, 89, 0.12); color: #208736;">₹0.00</span>
            </div>
            <div class="metric-box">
                Cost: <span id="todayCostValue" class="info-box" style="background-color: rgba(255, 149, 0, 0.12); color: #b25000;">₹0.00</span>
            </div>
            <div class="metric-box">
                Customers: <span id="todayCustomerCount" class="info-box info-sno" style="margin-left: 4px;">0</span>
            </div>
        </div>

        <div class="top-right">
            <span class="time-display" id="datetimeDisplay"></span>
            <button type="button" class="icon-btn" onclick="toggleDarkMode()" id="themeIcon">🌙</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="card" style="padding-bottom: 5px;">
                <div class="card-header">
                    <span id="formTitle">New Sale Entry</span>
                </div>
                
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" placeholder="Leave blank for Auto-Serial" autocomplete="off" autofocus>
                </div>

                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin: 15px 0 8px 0;">Experience Details</div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Bill No.</label>
                        <input type="text" id="billNo">
                    </div>
                    <div class="form-group">
                        <label>Payment Mode</label>
                        <select id="paymentMode">
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="padding-bottom: 10px; border-bottom: 1px solid var(--border-color);">
                    <label>Carry Bag</label>
                    <select id="carryBag">
                        <option value="Paper Pouch">Paper Pouch</option>
                        <option value="Stamped Carry bag">Stamped Carry bag</option>
                        <option value="Branded Carry bag">Branded Carry bag</option>
                    </select>
                </div>
                
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin: 15px 0 8px 0;">Item Details</div>

                <div id="itemsContainer">
                    <!-- Item rows injected here -->
                </div>

                <div class="form-actions" style="margin-top: 10px;">
                    <button type="button" onclick="addItemRow()">+ Add Item</button>
                    <div style="display: flex; gap: 6px;">
                        <button type="button" id="cancelEditBtn" onclick="clearForm()" style="display: none;">Cancel</button>
                        <button type="button" class="primary" id="saveBtn" onclick="saveSale()">Add Sale</button>
                    </div>
                </div>
                <div style="margin-top: 10px; text-align: right;">
                    <button type="button" class="danger" id="deleteEntryBtn" onclick="deleteCurrentSale()" style="display: none; width: 100%;">Delete this entry</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="card-header" style="padding: 12px; margin-bottom: 0; border: none; background: var(--card-bg); position: sticky; top: 0; z-index: 2; display: flex; align-items: center;">
                <div style="flex: 1;">
                    <span>Sales Records</span>
                </div>
                
                <!-- Godline Section -->
                <div id="godlineContainer" style="flex: 2; text-align: center; display: flex; justify-content: center; align-items: center; gap: 5px;">
                    <!-- Injected via JS -->
                </div>

                <!-- Symmetric Header Buttons -->
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1;">
                    <button type="button" class="danger" onclick="clearAllData()">Clear All Data</button>
                    <button type="button" onclick="exportToExcel()">Export (Excel)</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th style="width: 100px;">Date & Time</th>
                        <th style="width: 220px;">Customer Details</th>
                        <th>Items Purchased (Prices & Profit)</th>
                        <th style="width: 90px;">Total Sale</th>
                        <th style="width: 90px;">Total Profit</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
    let editingId = null;
    let saleVisible = true;
    let godlineText = localStorage.getItem('godline') || "Trust the Process ✨";

    const subCategories = {
        "RING": ["anti tarnish", "korean", "ad-cocktail", "ad-medium", "ad-small", "gold-white stone", "gold-red stone", "gold-cocktail", "gold plain"],
        "Pendant": ["anti-tarnish", "ad"],
        "Bracelet": ["anti-tarnish", "ad", "anti-tarnish chained", "ad chained"],
        "Earring": ["Korean", "Anti-tarnish", "hoops", "ad earrings", "ad studs", "iw", "pw", "funky"],
        "Chain": [],
        "Set": ["anti-tarnish", "ad simple", "ad 2 layer", "ad 3 layer", "ad heavy", "ad choker"],
        "Necklace": ["anti-tarnish", "ad"]
    };
    
    const categoriesList = Object.keys(subCategories);

    window.onload = () => {
        updateDateTime();
        setInterval(updateDateTime, 1000);
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeIcon').textContent = '☀️';
        }

        renderGodline();
        document.getElementById('billNo').value = getTodayBillPrefix();
        addItemRow(); 
        renderTable();
        calculateTodaySale();
        document.getElementById('customerName').focus();
    };

    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('datetimeDisplay').textContent = now.toLocaleDateString('en-US', options);
    }

    function getTodayBillPrefix() {
        const d = new Date();
        // Day + Month (1-indexed) + Hyphen
        return `${d.getDate()}${d.getMonth() + 1}-`;
    }

    function toggleDarkMode() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            icon.textContent = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            icon.textContent = '☀️';
        }
    }

    function toggleTodaySale() {
        saleVisible = !saleVisible;
        calculateTodaySale();
        document.getElementById('toggleSaleBtn').textContent = saleVisible ? "Hide" : "Show";
    }

    /* --- Godline Logic --- */
    function renderGodline() {
        const container = document.getElementById('godlineContainer');
        container.innerHTML = `
            <span class="godline-text">${godlineText}</span>
            <button type="button" class="icon-btn" onclick="editGodline()" title="Edit line" style="margin-left: 2px;">✏️</button>
        `;
    }

    function editGodline() {
        const container = document.getElementById('godlineContainer');
        container.innerHTML = `
            <input type="text" id="godlineInput" value="${godlineText}" style="width: 250px; padding: 4px 8px; text-align: center;">
            <button type="button" class="primary" onclick="saveGodline()" style="padding: 4px 8px; font-size: 0.65rem;">Save</button>
        `;
        document.getElementById('godlineInput').focus();
        document.getElementById('godlineInput').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') saveGodline();
        });
    }

    function saveGodline() {
        const inputVal = document.getElementById('godlineInput').value.trim();
        if(inputVal) {
            godlineText = inputVal;
            localStorage.setItem('godline', godlineText);
        }
        renderGodline();
    }
    /* --------------------- */

    function updateSubcatUI(selectElement, selectedSub = '') {
        const category = selectElement.value;
        const descContainer = selectElement.closest('.item-row').querySelector('.desc-wrapper');
        const options = subCategories[category];
        
        if (options && options.length > 0) {
            let selectHTML = `<select class="item-subcat">`;
            options.forEach(opt => {
                selectHTML += `<option value="${opt}">${opt}</option>`;
            });
            selectHTML += `</select>`;
            descContainer.innerHTML = selectHTML;
            if (selectedSub) {
                const subSelect = descContainer.querySelector('.item-subcat');
                if([...subSelect.options].some(o => o.value === selectedSub)) {
                    subSelect.value = selectedSub;
                }
            }
        } else {
            descContainer.innerHTML = `<input type="text" class="item-subcat" placeholder="Enter type..." value="${selectedSub}">`;
        }
    }

    function addItemRow(cat = '', subCat = '', sellPrice = '', buyPrice = '', vendor = 'Self', note = '', packaging = 'Packet') {
        if (typeof cat === 'object') { cat = ''; subCat = ''; sellPrice = ''; buyPrice = ''; vendor = 'Self'; note = ''; packaging = 'Packet'; } 

        const container = document.getElementById('itemsContainer');
        const rowDiv = document.createElement('div');
        rowDiv.className = 'item-row';

        const defaultCat = cat || categoriesList[0];

        let selectHTML = `<select class="item-category" onchange="updateSubcatUI(this)">`;
        categoriesList.forEach(c => {
            selectHTML += `<option value="${c}">${c}</option>`;
        });
        selectHTML += `</select>`;

        rowDiv.innerHTML = `
            <div class="form-grid-2">
                <div class="form-group"><label>Item Category</label>${selectHTML}</div>
                <div class="form-group"><label>Type</label><div class="desc-wrapper"></div></div>
            </div>
            
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Sell Price (₹)</label>
                    <input type="number" class="item-price" placeholder="0" step="10">
                </div>
                <div class="form-group">
                    <label>Buy Price (₹)</label>
                    <input type="number" class="item-buy-price" placeholder="0" step="10">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label>Vendor</label>
                    <select class="item-vendor">
                        <option value="Self">Self</option>
                        <option value="Vendor A">Vendor A</option>
                        <option value="Vendor B">Vendor B</option>
                        <option value="Vendor C">Vendor C</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <input type="text" class="item-note" placeholder="Extra details...">
                </div>
            </div>
            
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Packaging</label>
                    <select class="item-packaging">
                        <option value="Packet">Packet</option>
                        <option value="Packet with card">Packet with card</option>
                        <option value="Zipper">Zipper</option>
                        <option value="3x3 Box">3x3 Box</option>
                        <option value="4x4 Box">4x4 Box</option>
                        <option value="5x6 Box">5x6 Box</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end; justify-content: flex-end;">
                    <button type="button" class="danger" style="font-size: 0.65rem; padding: 6px 10px;" onclick="this.closest('.item-row').remove()">- Remove Item</button>
                </div>
            </div>
        `;
        
        container.appendChild(rowDiv);

        if (cat) rowDiv.querySelector('.item-category').value = cat;
        if (vendor) rowDiv.querySelector('.item-vendor').value = vendor;
        if (packaging) rowDiv.querySelector('.item-packaging').value = packaging;
        if (buyPrice !== '') rowDiv.querySelector('.item-buy-price').value = buyPrice;
        if (sellPrice !== '') rowDiv.querySelector('.item-price').value = sellPrice;
        if (note !== '') rowDiv.querySelector('.item-note').value = note;
        
        updateSubcatUI(rowDiv.querySelector('.item-category'), subCat);
    }

    function clearForm() {
        document.getElementById('customerName').value = '';
        document.getElementById('billNo').value = getTodayBillPrefix();
        document.getElementById('paymentMode').value = 'Cash';
        document.getElementById('carryBag').value = 'Paper Pouch';

        document.getElementById('itemsContainer').innerHTML = '';
        addItemRow();
        editingId = null;
        
        document.getElementById('formTitle').textContent = "New Sale Entry";
        document.getElementById('saveBtn').textContent = "Add Sale";
        document.getElementById('cancelEditBtn').style.display = "none";
        document.getElementById('deleteEntryBtn').style.display = "none";
        document.getElementById('customerName').focus();
    }

    function getNextSerial() {
        if (salesData.length === 0) return 1;
        const maxSerial = Math.max(...salesData.map(s => s.serialNo || 0));
        return maxSerial + 1;
    }

    function saveSale() {
        const nameInput = document.getElementById('customerName').value.trim();
        const billNo = document.getElementById('billNo').value.trim();
        const paymentMode = document.getElementById('paymentMode').value;
        const carryBag = document.getElementById('carryBag').value;
        
        let currentSerialNo;
        if (editingId) {
            const existing = salesData.find(s => s.id === editingId);
            currentSerialNo = existing.serialNo || getNextSerial();
        } else {
            currentSerialNo = getNextSerial(); 
        }

        let customerName = nameInput === "" ? `Customer #${currentSerialNo}` : nameInput;

        const rows = document.querySelectorAll('.item-row');
        let items = [];
        let total = 0;
        let totalCost = 0;
        let totalProfit = 0;

        rows.forEach(row => {
            const category = row.querySelector('.item-category').value;
            const subCategoryNode = row.querySelector('.item-subcat');
            const subCategory = subCategoryNode ? subCategoryNode.value.trim() : '';
            const vendor = row.querySelector('.item-vendor').value;
            const note = row.querySelector('.item-note').value.trim();
            const packaging = row.querySelector('.item-packaging').value;
            const buyPrice = parseFloat(row.querySelector('.item-buy-price').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            
            if (price > 0 || buyPrice > 0) {
                const profit = price - buyPrice;
                items.push({ category, subCategory, vendor, note, buyPrice, price, profit, packaging });
                total += price;
                totalCost += buyPrice;
                totalProfit += profit;
            }
        });

        if (items.length === 0) {
            alert("Please add at least one item with a valid price.");
            return;
        }

        const saleRecord = {
            id: editingId ? editingId : Date.now(),
            serialNo: currentSerialNo,
            timestamp: editingId ? salesData.find(s => s.id === editingId).timestamp : new Date().toISOString(),
            customerName,
            billNo,
            paymentMode,
            carryBag,
            items,
            total,
            totalCost,
            totalProfit
        };

        if (editingId) {
            const index = salesData.findIndex(s => s.id === editingId);
            if (index !== -1) salesData[index] = saleRecord;
        } else {
            salesData.unshift(saleRecord);
        }

        localStorage.setItem('salesData', JSON.stringify(salesData));
        clearForm();
        renderTable();
        calculateTodaySale();
    }

    function editSale(id) {
        const sale = salesData.find(s => s.id === id);
        if (!sale) return;

        document.getElementById('customerName').value = sale.customerName;
        document.getElementById('billNo').value = sale.billNo || getTodayBillPrefix();
        document.getElementById('paymentMode').value = sale.paymentMode || 'Cash';
        document.getElementById('carryBag').value = sale.carryBag || 'Paper Pouch';

        document.getElementById('itemsContainer').innerHTML = '';
        
        sale.items.forEach(item => {
            addItemRow(
                item.category, 
                item.subCategory || '', 
                item.price, 
                item.buyPrice || '', 
                item.vendor || 'Self', 
                item.note || '', 
                item.packaging || 'Packet'
            );
        });

        editingId = id;
        document.getElementById('formTitle').textContent = `Edit Sale Entry #${sale.serialNo || 'Old'}`;
        document.getElementById('saveBtn').textContent = "Update Sale";
        document.getElementById('cancelEditBtn').style.display = "inline-block";
        document.getElementById('deleteEntryBtn').style.display = "inline-block";
        
        document.querySelector('.left-panel').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCurrentSale() {
        if (!editingId) return;
        if(confirm("Are you sure you want to delete this entry?")) {
            salesData = salesData.filter(s => s.id !== editingId);
            localStorage.setItem('salesData', JSON.stringify(salesData));
            clearForm();
            renderTable();
            calculateTodaySale();
        }
    }

    function clearAllData() {
        if(confirm("🚨 WARNING: Are you sure you want to delete ALL sales data? This cannot be undone!")) {
            if(confirm("Are you absolutely sure? All records will be permanently lost.")) {
                salesData = [];
                localStorage.removeItem('salesData');
                clearForm();
                renderTable();
                calculateTodaySale();
                alert("All data has been cleared.");
            }
        }
    }

    function renderTable() {
        const tbody = document.getElementById('salesTableBody');
        tbody.innerHTML = '';

        salesData.forEach(sale => {
            const dateObj = new Date(sale.timestamp);
            const dateStr = dateObj.toLocaleDateString([], {month:'short', day:'numeric'}) + '<br><span style="font-size:0.65rem; color:var(--text-muted);">' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '</span>';
            const serialDisplay = sale.serialNo ? sale.serialNo : '-';

            let saleTotal = sale.total || 0;
            let saleProfit = sale.totalProfit !== undefined ? sale.totalProfit : sale.items.reduce((acc, item) => acc + (item.price - (item.buyPrice || 0)), 0);

            let itemsHTML = '<ul class="item-list">';
            sale.items.forEach(item => {
                const catString = item.subCategory ? `${item.category} > ${item.subCategory}` : item.category;
                const noteStr = item.note ? `<span class="desc-text" style="margin-left: 4px;">(${item.note})</span>` : '';
                const vendorTag = `<span class="info-box" style="background-color: rgba(142, 142, 147, 0.15);">👤 ${item.vendor || 'Self'}</span>`;
                const buyTag = `<span class="desc-text">Buy: ₹${(item.buyPrice || 0).toFixed(2)}</span>`;
                const sellTag = `<span class="info-box info-amount">Sell: ₹${item.price.toFixed(2)}</span>`;
                const itemProfit = item.price - (item.buyPrice || 0);
                const profitTag = `<span class="info-box" style="background-color: rgba(52, 199, 89, 0.15); color: #208736;">Profit: ₹${itemProfit.toFixed(2)}</span>`;
                const packTag = item.packaging ? `<span class="desc-text" style="margin-left: 4px;">[📦 ${item.packaging}]</span>` : '';

                itemsHTML += `<li style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dotted var(--border-color); display: flex; flex-direction: column; gap: 4px;">
                    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                        <span class="info-box info-cat">${catString}</span>
                        ${vendorTag}
                        ${packTag}
                        ${noteStr}
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        ${buyTag}
                        ${sellTag}
                        ${profitTag}
                    </div>
                </li>`;
            });
            itemsHTML += '</ul>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="info-box info-sno">#${serialDisplay}</span></td>
                <td><span class="info-date" style="padding: 2px 4px; border-radius:3px;">${dateStr}</span></td>
                <td>
                    <!-- Refined layout for Customer Name and small Edit icon -->
                    <div style="display:flex; align-items:center; gap: 6px;">
                        <strong style="font-size: 0.85rem;">${sale.customerName}</strong>
                        <button type="button" class="icon-btn" title="Edit Sale" onclick="editSale(${sale.id})" style="font-size: 0.65rem; padding: 2px; color: var(--accent-blue);">✏️</button>
                    </div>
                    <div class="desc-text" style="margin-top: 4px; line-height: 1.5;">
                        <span style="font-weight: 600; color: var(--text-main);">Bill No:</span> ${sale.billNo || '-'}<br>
                        <span style="font-weight: 600; color: var(--text-main);">Payment:</span> ${sale.paymentMode || 'N/A'}<br>
                        <span style="font-weight: 600; color: var(--text-main);">Carry Bag:</span> ${sale.carryBag || '-'}
                    </div>
                </td>
                <td>${itemsHTML}</td>
                <td><span class="info-box info-amount" style="font-size: 0.8rem;">₹${saleTotal.toFixed(2)}</span></td>
                <td><span class="info-box" style="background-color: rgba(52, 199, 89, 0.15); color: #208736; font-size: 0.8rem;">₹${saleProfit.toFixed(2)}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calculateTodaySale() {
        const today = new Date().toLocaleDateString();
        let totalSale = 0;
        let totalCost = 0;
        let totalProfit = 0;
        let customerCount = 0;
        
        salesData.forEach(sale => {
            const saleDate = new Date(sale.timestamp).toLocaleDateString();
            if (saleDate === today) {
                customerCount++;
                sale.items.forEach(item => {
                    const bPrice = item.buyPrice || 0;
                    const sPrice = item.price || 0;
                    totalSale += sPrice;
                    totalCost += bPrice;
                    totalProfit += (sPrice - bPrice);
                });
            }
        });

        document.getElementById('todayCustomerCount').textContent = customerCount;

        const valSpan = document.getElementById('todayTotalValue');
        const profitSpan = document.getElementById('todayProfitValue');
        const costSpan = document.getElementById('todayCostValue');

        if (saleVisible) {
            valSpan.textContent = `₹${totalSale.toFixed(2)}`;
            profitSpan.textContent = `₹${totalProfit.toFixed(2)}`;
            costSpan.textContent = `₹${totalCost.toFixed(2)}`;
        } else {
            valSpan.textContent = "****";
            profitSpan.textContent = "****";
            costSpan.textContent = "****";
        }
    }

    function exportToExcel() {
        if(salesData.length === 0) {
            alert("No data to export!");
            return;
        }

        let csvContent = "S.No.,Date,Time,Customer Name,Bill No,Payment Mode,Carry Bag,Item Category,Item Type,Item Packaging,Vendor,Buy Price,Sell Price,Profit,Extra Note,Sale Total,Sale Profit\n";

        salesData.forEach(sale => {
            const dateObj = new Date(sale.timestamp);
            const date = dateObj.toLocaleDateString();
            const time = dateObj.toLocaleTimeString();
            const customer = `"${sale.customerName.replace(/"/g, '""')}"`;
            const billNo = `"${(sale.billNo || '').replace(/"/g, '""')}"`;
            const paymentMode = `"${(sale.paymentMode || '').replace(/"/g, '""')}"`;
            const carryBag = `"${(sale.carryBag || '').replace(/"/g, '""')}"`;
            const sno = sale.serialNo || '';
            const total = sale.total.toFixed(2);
            const saleProfit = (sale.totalProfit !== undefined ? sale.totalProfit : sale.items.reduce((acc, i) => acc + (i.price - (i.buyPrice || 0)), 0)).toFixed(2);

            sale.items.forEach((item, index) => {
                const subCatData = item.subCategory || '';
                const noteData = item.note || '';
                const itemVendor = `"${(item.vendor || 'Self').replace(/"/g, '""')}"`;
                const packaging = `"${(item.packaging || 'Packet').replace(/"/g, '""')}"`;

                const cat = item.category;
                const type = `"${subCatData.replace(/"/g, '""')}"`;
                const note = `"${noteData.replace(/"/g, '""')}"`;
                const buyPrice = (item.buyPrice || 0).toFixed(2);
                const sellPrice = item.price.toFixed(2);
                const profit = (item.price - (item.buyPrice || 0)).toFixed(2);
                
                const displayTotal = (index === sale.items.length - 1) ? total : "";
                const displaySaleProfit = (index === sale.items.length - 1) ? saleProfit : "";
                
                csvContent += `${sno},${date},${time},${customer},${billNo},${paymentMode},${carryBag},${cat},${type},${packaging},${itemVendor},${buyPrice},${sellPrice},${profit},${note},${displayTotal},${displaySaleProfit}\n`;
            });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `Sales_Export_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
