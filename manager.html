<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Sales Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-bg: #e5e5ea;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #6e6e73;
            --border: #c6c6c8;
            --primary: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --focus-border: #000000; /* Black highlight for focused field */
            --badge-grey: #f2f2f7;
            --badge-grey-text: #1c1c1e;
            --badge-blue: #007aff15;
            --badge-blue-text: #0056b3;
            --badge-red: #ff3b3015;
            --badge-red-text: #c01910;
            --badge-green: #34c75915;
            --badge-green-text: #20873a;
            --badge-yellow: #ffcc0025;
            --badge-yellow-text: #8a6d00;
        }

        [data-theme="dark"] {
            --app-bg: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #98989d;
            --border: #38383a;
            --focus-border: #ffffff; /* White highlight for dark mode */
            --badge-grey: #2c2c2e;
            --badge-grey-text: #ffffff;
            --badge-blue: #0a84ff25;
            --badge-blue-text: #5e9cff;
            --badge-red: #ff453a25;
            --badge-red-text: #ff6b62;
            --badge-green: #32d74b25;
            --badge-green-text: #59f06f;
            --badge-yellow: #ffd60a25;
            --badge-yellow-text: #ffdf40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--app-bg);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 600;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 14px;
            height: 14px;
        }

        /* Top Bar */
        .topbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stat-badge {
            padding: 3px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 11px;
        }

        .stat-total { background-color: var(--badge-blue); color: var(--badge-blue-text); border: 1px solid #007aff30;}
        .stat-profit { background-color: var(--badge-green); color: var(--badge-green-text); border: 1px solid #34c75930; }
        .stat-cost { background-color: var(--badge-red); color: var(--badge-red-text); border: 1px solid #ff3b3030;}
        .stat-cust { background-color: var(--badge-yellow); color: var(--badge-yellow-text); border: 1px solid #ffcc0040;}

        .topbar-mid {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 12px;
        }

        #godline-input {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 2px 5px;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
            display: none;
            text-align: center;
            width: 180px;
            margin-bottom: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-right: 5px;
        }

        .clock {
            color: var(--text-main);
            font-weight: 800;
            font-size: 11px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .icon-btn:hover { background-color: var(--badge-grey); color: var(--text-main); }
        .icon-btn.active { color: var(--primary); background-color: var(--badge-blue); }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
        }

        /* Left Panel */
        .left-panel {
            width: 28%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        h2, h3 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        /* Customer Row Layout (Restored side-by-side layout) */
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .form-row > * {
            flex: 1;
            margin-bottom: 0 !important;
        }

        /* Base Input & Select Styling */
        input, select {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.1s, box-shadow 0.1s;
        }

        /* Prominent Focus Outline */
        input:focus, select:focus { 
            border-color: var(--focus-border) !important;
            box-shadow: 0 0 0 1px var(--focus-border) !important; 
        }
        
        input::placeholder { color: var(--text-muted); font-weight: 500; }
        .placeholder-active { color: var(--text-muted); }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%236e6e73" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            padding-right: 28px;
        }
        
        select option {
            color: #000000;
            background-color: #ffffff;
            font-weight: 600;
        }
        [data-theme="dark"] select option {
            color: #ffffff;
            background-color: #1c1c1e;
        }

        /* Single-line item form layout */
        .item-entry {
            background-color: var(--badge-grey);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            position: relative;
        }

        .item-entry input, .item-entry select {
            margin-bottom: 8px;
        }

        .item-entry input:last-child {
            margin-bottom: 0;
        }

        .item-header-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .remove-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--danger);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .remove-item svg { width: 10px; height: 10px; stroke-width: 3; }

        .btn {
            padding: 8px 10px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        .btn-outline { background-color: transparent; border: 1px dashed var(--primary); color: var(--primary); }
        .btn-primary { background-color: var(--primary); color: white; margin-top: 10px; }
        .btn-danger { background-color: var(--danger); color: white; margin-top: 6px; display: none; }

        /* Right Panel */
        .right-panel {
            width: 72%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--badge-grey);
        }

        .table-actions {
            display: flex;
            gap: 6px;
        }

        .btn-export { background-color: var(--success); color: white; width: auto;}
        .btn-wipe { background-color: var(--danger); color: white; width: auto; opacity: 0.4; cursor: not-allowed; }
        .btn-wipe.enabled { opacity: 1; cursor: pointer; }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--card-bg);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 10px;
            padding: 6px 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .row-edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            display: none;
            padding: 0;
            margin-left: 4px;
        }
        
        .edit-mode-on .row-edit-btn { display: inline-flex; align-items: center; }
        .edit-mode-on .godline-edit { display: inline-flex !important; }
        .edit-mode-on #godline-text { cursor: pointer; text-decoration: underline dotted; }

        .td-customer { line-height: 1.4; }
        .cust-name { font-weight: 700; font-size: 12px; color: var(--text-main); display: flex; align-items: center; }
        .cust-details { color: var(--text-muted); font-size: 10px; }

        .summary-badge-line {
            display: flex;
            gap: 4px;
            margin-bottom: 3px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .sm-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .lg-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            border: 1px solid transparent;
        }
        
        .bg-grey { background-color: var(--badge-grey); color: var(--badge-grey-text); border-color: var(--border); }
        .bg-blue { background-color: var(--badge-blue); color: var(--badge-blue-text); border-color: #007aff30; }
        .bg-red { background-color: var(--badge-red); color: var(--badge-red-text); border-color: #ff3b3030; }
        .bg-green { background-color: var(--badge-green); color: var(--badge-green-text); border-color: #34c75930; }

        .item-num-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--badge-grey);
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-size: 9px;
            font-weight: 700;
        }

        .item-summary-block {
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border);
        }
        .item-summary-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="stat-badge stat-total">Total: <span id="val-total">0</span></div>
            <div class="stat-badge stat-profit">Profit: <span id="val-profit">0</span></div>
            <div class="stat-badge stat-cost">Cost: <span id="val-cost">0</span></div>
            <div class="stat-badge stat-cust">Customers: <span id="val-cust">0</span></div>
        </div>
        
        <div class="topbar-mid">
            <span id="godline-text">Welcome to Store</span>
            <input type="text" id="godline-input">
            <button class="icon-btn godline-edit" id="btn-edit-godline" style="display: none;" title="Edit Godline">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
        </div>

        <div class="topbar-right">
            <div class="brand-name">Amorvi</div>
            <div class="clock" id="clock-display">00:00:00</div>
            <button class="icon-btn" id="btn-hide" title="Hide Amounts">
                <svg id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <button class="icon-btn" id="btn-edit-mode" title="Toggle Edit Mode">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
            <button class="icon-btn" id="btn-theme" title="Toggle Theme">
                <svg id="icon-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        
        <!-- Left Panel: Form -->
        <div class="left-panel">
            <h2 id="form-title">New Sale Entry</h2>
            <form id="sale-form">
                <input type="hidden" id="edit-id" value="">
                
                <!-- Customer Details Options (Side-by-side rows as before) -->
                <div class="form-row">
                    <input type="text" id="cust-name" placeholder="Customer Name">
                    <input type="text" id="bill-no" placeholder="Bill No." required>
                </div>
                <div class="form-row">
                    <select id="payment-mode" class="placeholder-active" required onchange="this.classList.remove('placeholder-active')">
                        <option value="" hidden selected>Choose payment mode</option>
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                    </select>
                    <input type="number" step="any" id="discount-total" placeholder="Discount (Total)">
                </div>

                <h3 style="margin-top: 10px;">Items</h3>
                <div id="items-container">
                    <!-- Dynamic item entries -->
                </div>
                
                <button type="button" class="btn btn-outline" id="btn-add-item">Add Item +</button>
                <button type="submit" class="btn btn-primary" id="btn-submit-sale">Add Sale</button>
                <button type="button" class="btn btn-danger" id="btn-delete-sale">Delete this Sale</button>
            </form>
        </div>

        <!-- Right Panel: Table -->
        <div class="right-panel">
            <div class="table-header">
                <h3 style="margin:0;">Sales Data</h3>
                <div class="table-actions">
                    <button class="btn btn-export" id="btn-export">Close Sale</button>
                    <button class="btn btn-wipe" id="btn-wipe" disabled>Wipe Data</button>
                </div>
            </div>
            
            <div class="table-container" id="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th width="5%">Sr.</th>
                            <th width="15%">Timestamp</th>
                            <th width="20%">Customer Details</th>
                            <th width="45%">Items Summary</th>
                            <th width="15%">Total Sale</th>
                        </tr>
                    </thead>
                    <tbody id="sales-tbody">
                        <!-- Dynamic sales rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
const catSubcatMap = {
    "Ring": ["Anti Tarnish", "Korean", "AD-Cocktail", "AD-Medium", "AD-Small", "Gold -White Stone", "Gold -Red Stone", "Gold -Cocktail", "Gold -Plain"],
    "Pendant": ["Anti-Tarnish", "AD"],
    "Bracelet": ["Anti-Tarnish", "AD", "Anti-Tarnish Chained", "AD Chained"],
    "Earring": ["Korean", "Anti-tarnish", "Hoops", "AD Earrings", "Anti-Tarnish Studs", "General Studs", "AD Studs" ,"Gold Studs", "Indo-Western", "Partywear", "Funky"],
    "Chain": ["AT Sleek Snake", "AT Snake", "AT Balls", "Silver", "Micro-Gold 18 Inch 1L" ,"Micro-Gold 18 Inch 2L" ,"Micro-Gold 24 Inch 2L", "Micro-Gold 24 Inch 3L" ,"Men's"],
    "Set": ["Anti-Tarnish", "AD One", "AD 2 Layer", "AD 3 layer", "AD Heavy", "AD choker" ,"Indian Kundan/Polki Stone cut (Small)" ,"Indian Kundan/Polki Stone cut (Big)"],
    "Necklace": ["Anti-Tarnish", "AD"]
};

const vendorOptions = [
    "NA", "Bhagvat Imitation", "Inayat Fashions", "Singh Fashion Emproium", 
    "VM Jewellers", "VK Fashion Mart", "A-One AD", "Maa Vaishno Jewellers", 
    "Shree Shyam Jewellers", "Minari Mumbai", "Aggarwal Novelties", "Neenox/Lezara NX"
];

const packagingOptions = ["3x3 Box", "4x4 Box", "5x6 Box", "Packet Packaging"];

let sales = JSON.parse(localStorage.getItem('jewelrySalesData')) || [];
let godline = localStorage.getItem('jewelryGodline') || "Welcome to Store";
let theme = localStorage.getItem('jewelryTheme') || "light";
let editMode = false;
let hiddenMode = false;
let isExported = false; 

const formatCurrency = (amount) => `₹${Number(amount).toLocaleString('en-IN')}`;

const getBillPrefix = () => {
    const d = new Date();
    const date = d.getDate();
    const month = d.getMonth() + 1;
    const year = d.getFullYear().toString().slice(-2);
    return `${date}${month}${year}-`;
};

const updateClock = () => {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    document.getElementById('clock-display').innerText = `${dateStr} | ${timeStr}`;
};
setInterval(updateClock, 1000);
updateClock();

const saveState = () => {
    localStorage.setItem('jewelrySalesData', JSON.stringify(sales));
    localStorage.setItem('jewelryGodline', godline);
    localStorage.setItem('jewelryTheme', theme);
    renderAll();
};

// SVG icons
const iconSun = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
const iconMoon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
const iconEye = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
const iconEyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
const iconEdit = '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>';
const iconSave = '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>';

const applyTheme = () => {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('icon-theme').innerHTML = theme === 'dark' ? iconMoon : iconSun;
};

// Keydown increment/decrement by 10
document.addEventListener('keydown', (e) => {
    if (e.target.tagName.toLowerCase() === 'input' && e.target.type === 'number') {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();
            let currentVal = parseFloat(e.target.value) || 0;
            let increment = e.key === 'ArrowUp' ? 10 : -10;
            e.target.value = currentVal + increment;
        }
    }
});

// Auto Focus Next Field helper
function focusNextField(currentEl) {
    const form = document.getElementById('sale-form');
    const focusables = Array.from(form.querySelectorAll('input:not([type="hidden"]), select, button:not([type="button"])'))
        .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0 && getComputedStyle(el).visibility !== 'hidden');
    const index = focusables.indexOf(currentEl);
    if (index > -1 && index < focusables.length - 1) {
        focusables[index + 1].focus();
    }
}

// Auto shift focus on select change & enter press
document.getElementById('sale-form').addEventListener('change', (e) => {
    if (e.target.tagName === 'SELECT') {
        focusNextField(e.target);
    }
});

document.getElementById('sale-form').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
        focusNextField(e.target);
    }
});

// Topbar Events
document.getElementById('godline-text').innerText = godline;
document.getElementById('godline-input').value = godline;

document.getElementById('btn-theme').addEventListener('click', () => {
    theme = theme === 'light' ? 'dark' : 'light';
    applyTheme();
    saveState();
});

document.getElementById('btn-hide').addEventListener('click', (e) => {
    hiddenMode = !hiddenMode;
    document.getElementById('icon-eye').innerHTML = hiddenMode ? iconEyeOff : iconEye;
    renderStats();
});

document.getElementById('btn-edit-mode').addEventListener('click', (e) => {
    editMode = !editMode;
    e.currentTarget.classList.toggle('active', editMode);
    document.body.classList.toggle('edit-mode-on', editMode);
});

// Godline Editing
const godlineText = document.getElementById('godline-text');
const godlineInput = document.getElementById('godline-input');
const btnEditGodline = document.getElementById('btn-edit-godline');

const toggleGodlineEdit = () => {
    if (godlineText.style.display !== 'none') {
        godlineText.style.display = 'none';
        godlineInput.style.display = 'inline-block';
        godlineInput.value = godline;
        godlineInput.focus();
        btnEditGodline.innerHTML = `<svg viewBox="0 0 24 24">${iconSave}</svg>`;
    } else {
        godline = godlineInput.value.trim() || "Welcome to Store";
        godlineText.innerText = godline;
        godlineText.style.display = 'inline-block';
        godlineInput.style.display = 'none';
        btnEditGodline.innerHTML = `<svg viewBox="0 0 24 24">${iconEdit}</svg>`;
        saveState();
    }
};

btnEditGodline.addEventListener('click', toggleGodlineEdit);
godlineText.addEventListener('click', () => {
    if (editMode) toggleGodlineEdit();
});

// Refresh Item Labels
const refreshFormItemNumbers = () => {
    const entries = document.querySelectorAll('.item-entry');
    entries.forEach((entry, index) => {
        const label = entry.querySelector('.item-index-tag');
        if (label) label.innerText = `Item ${index + 1}`;
    });
};

const createItemEntryHTML = (data = null) => {
    const isCatSelected = data && data.cat;
    let catOptions = `<option value="" hidden selected>Choose Item</option>`;
    Object.keys(catSubcatMap).forEach(cat => {
        catOptions += `<option value="${cat}" ${data && data.cat === cat ? 'selected' : ''}>${cat}</option>`;
    });

    const isVenSelected = data && data.vendor && data.vendor !== 'NA';
    let vendorHTML = `<option value="" hidden selected>Choose Vendor</option>`;
    vendorOptions.forEach(v => {
        vendorHTML += `<option value="${v}" ${data && data.vendor === v ? 'selected' : ''}>${v}</option>`;
    });

    const isPkgSelected = data && data.pkg && data.pkg !== 'NA';
    let pkgHTML = `<option value="" hidden selected>Choose packaging</option>`;
    packagingOptions.forEach(p => {
        pkgHTML += `<option value="${p}" ${data && data.pkg === p ? 'selected' : ''}>${p}</option>`;
    });

    let subcatHTML = `<option value="" hidden selected>Choose Subcategory</option>`;
    if (isCatSelected) {
        catSubcatMap[data.cat].forEach(sub => {
            subcatHTML += `<option value="${sub}" ${data.subcat === sub ? 'selected' : ''}>${sub}</option>`;
        });
    }

    const div = document.createElement('div');
    div.className = 'item-entry';
    // Single-line stacked inputs per item block
    div.innerHTML = `
        <div class="item-header-label">
            <span class="item-index-tag">Item 1</span>
            <button type="button" class="remove-item" title="Remove Item"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <select class="item-cat ${isCatSelected ? '' : 'placeholder-active'}" required onchange="this.classList.remove('placeholder-active')">${catOptions}</select>
        <select class="item-subcat ${data && data.subcat ? '' : 'placeholder-active'}" required onchange="this.classList.remove('placeholder-active')">${subcatHTML}</select>
        <select class="item-vendor ${isVenSelected ? '' : 'placeholder-active'}" onchange="this.classList.remove('placeholder-active')">${vendorHTML}</select>
        <input type="number" step="any" class="item-buy" placeholder="Buy Price (109)" value="${data ? (data.buy === 'NA' ? '' : data.buy) : ''}">
        <input type="number" step="any" class="item-sell" placeholder="Sell Price (449)" required value="${data ? data.sell : ''}">
        <select class="item-pkg ${isPkgSelected ? '' : 'placeholder-active'}" onchange="this.classList.remove('placeholder-active')">${pkgHTML}</select>
        <input type="text" class="item-note" placeholder="Note (Optional)" value="${data ? data.note : ''}">
    `;

    const catSelect = div.querySelector('.item-cat');
    const subcatSelect = div.querySelector('.item-subcat');
    
    catSelect.addEventListener('change', (e) => {
        const cat = e.target.value;
        subcatSelect.innerHTML = `<option value="" hidden selected>Choose Subcategory</option>`;
        subcatSelect.classList.add('placeholder-active');
        if(catSubcatMap[cat]) {
            catSubcatMap[cat].forEach(sub => {
                subcatSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        }
    });

    div.querySelector('.remove-item').addEventListener('click', () => {
        if (document.querySelectorAll('.item-entry').length > 1) { 
            div.remove(); 
            refreshFormItemNumbers();
        } else { 
            alert('At least one item is required.'); 
        }
    });

    return div;
};

const itemsContainer = document.getElementById('items-container');
document.getElementById('btn-add-item').addEventListener('click', () => {
    itemsContainer.appendChild(createItemEntryHTML());
    refreshFormItemNumbers();
});

const resetForm = () => {
    document.getElementById('sale-form').reset();
    document.getElementById('edit-id').value = '';
    document.getElementById('bill-no').value = getBillPrefix();
    
    document.querySelectorAll('select').forEach(s => s.classList.add('placeholder-active'));
    
    itemsContainer.innerHTML = '';
    itemsContainer.appendChild(createItemEntryHTML());
    refreshFormItemNumbers();

    document.getElementById('btn-submit-sale').innerText = 'Add Sale';
    document.getElementById('btn-delete-sale').style.display = 'none';
    document.getElementById('form-title').innerText = 'New Sale Entry';
    document.querySelectorAll('input, select').forEach(el => el.style.borderColor = 'var(--border)');
};

document.getElementById('sale-form').addEventListener('submit', (e) => {
    e.preventDefault();
    let isValid = true;
    
    document.querySelectorAll('#payment-mode, .item-cat, .item-subcat, .item-sell').forEach(el => {
        if (!el.value || el.value.trim() === '') {
            el.style.borderColor = 'var(--danger)';
            isValid = false;
        } else {
            el.style.borderColor = 'var(--border)';
        }
    });

    if (!isValid) return;

    const editId = document.getElementById('edit-id').value;
    const items = Array.from(document.querySelectorAll('.item-entry')).map(entry => {
        const buyVal = entry.querySelector('.item-buy').value;
        return {
            cat: entry.querySelector('.item-cat').value,
            subcat: entry.querySelector('.item-subcat').value,
            vendor: entry.querySelector('.item-vendor').value || 'NA',
            buy: buyVal ? parseFloat(buyVal) : 'NA',
            sell: parseFloat(entry.querySelector('.item-sell').value),
            pkg: entry.querySelector('.item-pkg').value || 'NA',
            note: entry.querySelector('.item-note').value || ''
        };
    });

    let custName = document.getElementById('cust-name').value.trim();
    let rawBill = document.getElementById('bill-no').value.trim();
    if(rawBill === getBillPrefix()) rawBill += "NA"; 

    const saleRecord = {
        id: editId || Date.now().toString(),
        timestamp: new Date().toISOString(),
        customerName: custName,
        billNo: rawBill,
        paymentMode: document.getElementById('payment-mode').value || 'NA',
        discount: parseFloat(document.getElementById('discount-total').value) || 0,
        items: items
    };

    if (editId) {
        const idx = sales.findIndex(s => s.id === editId);
        if (idx !== -1) sales[idx] = saleRecord;
    } else {
        sales.push(saleRecord);
    }

    isExported = false;
    updateExportWipeUI();
    saveState();
    resetForm();
});

document.getElementById('btn-delete-sale').addEventListener('click', () => {
    const editId = document.getElementById('edit-id').value;
    if (editId && confirm('Delete this sale permanently?')) {
        sales = sales.filter(s => s.id !== editId);
        isExported = false;
        updateExportWipeUI();
        saveState();
        resetForm();
    }
});

const loadSaleIntoForm = (id) => {
    const sale = sales.find(s => s.id === id);
    if (!sale) return;

    document.getElementById('form-title').innerText = 'Edit Sale';
    document.getElementById('edit-id').value = sale.id;
    document.getElementById('cust-name').value = sale.customerName;
    document.getElementById('bill-no').value = sale.billNo;
    
    const payMode = document.getElementById('payment-mode');
    payMode.value = sale.paymentMode === 'NA' ? '' : sale.paymentMode;
    if(payMode.value) payMode.classList.remove('placeholder-active');
    
    document.getElementById('discount-total').value = sale.discount || '';

    itemsContainer.innerHTML = '';
    sale.items.forEach(item => { itemsContainer.appendChild(createItemEntryHTML(item)); });
    refreshFormItemNumbers();

    document.getElementById('btn-submit-sale').innerText = 'Update Sale';
    document.getElementById('btn-delete-sale').style.display = 'block';
};

const renderStats = () => {
    let totalsale = 0, totalcost = 0;
    sales.forEach(s => {
        let itemsSum = s.items.reduce((acc, it) => acc + it.sell, 0);
        let itemsCost = s.items.reduce((acc, it) => acc + (it.buy === 'NA' ? 0 : it.buy), 0);
        totalsale += (itemsSum - s.discount);
        totalcost += itemsCost;
    });
    let totalprofit = totalsale - totalcost;

    document.getElementById('val-total').innerText = hiddenMode ? '***' : formatCurrency(totalsale);
    document.getElementById('val-profit').innerText = hiddenMode ? '***' : formatCurrency(totalprofit);
    document.getElementById('val-cost').innerText = hiddenMode ? '***' : formatCurrency(totalcost);
    document.getElementById('val-cust').innerText = sales.length;
};

const renderTable = () => {
    const tbody = document.getElementById('sales-tbody');
    tbody.innerHTML = '';

    for (let index = sales.length - 1; index >= 0; index--) {
        const sale = sales[index];
        const srNo = index + 1;
        const cName = sale.customerName || `Customer #${srNo}`;
        const dateObj = new Date(sale.timestamp);
        const timeStr = `${dateObj.toLocaleDateString('en-GB')} <br> <span style="color:var(--text-main)">${dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', hour12: true})}</span>`;
        
        const itemSum = sale.items.reduce((acc, it) => acc + it.sell, 0);
        const finalTotal = itemSum - sale.discount;

        let itemsHtml = '';
        sale.items.forEach((it, itemIdx) => {
            const profit = it.sell - (it.buy === 'NA' ? 0 : it.buy);
            itemsHtml += `
                <div class="item-summary-block">
                    <div class="summary-badge-line">
                        <span class="item-num-circle">${itemIdx + 1}</span>
                        <span class="sm-badge bg-grey">${it.cat} > ${it.subcat}</span>
                        ${it.pkg !== 'NA' ? `<span class="sm-badge bg-blue">${it.pkg}</span>` : ''}
                    </div>
                    <div class="summary-badge-line">
                        ${it.vendor !== 'NA' ? `<span class="sm-badge bg-grey">${it.vendor}</span>` : ''}
                        <span class="sm-badge bg-red">Buy: ${it.buy === 'NA' ? 'NA' : '₹'+it.buy}</span>
                        <span class="sm-badge bg-green">Sell: ₹${it.sell}</span>
                        <span class="sm-badge bg-green">Profit: ₹${profit}</span>
                    </div>
                    ${it.note ? `<div style="font-size: 9px; color: var(--text-muted); margin-top: 2px;">Note: ${it.note}</div>` : ''}
                </div>
            `;
        });

        if (sale.discount > 0) itemsHtml += `<div class="summary-badge-line"><span class="sm-badge bg-red">Disc Applied: ₹${sale.discount}</span></div>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight: 700; color:var(--text-main);">#${srNo}</td>
            <td style="font-size: 10px; color: var(--text-muted); line-height: 1.4;">${timeStr}</td>
            <td class="td-customer">
                <div class="cust-name">${cName} 
                    <button class="row-edit-btn" onclick="loadSaleIntoForm('${sale.id}')" title="Edit">
                        <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    </button>
                </div>
                <div class="cust-details">Bill No.: <span style="color:var(--text-main); font-weight: 600;">${sale.billNo}</span></div>
                <div class="cust-details">Payment Mode: <span style="color:var(--text-main); font-weight: 600;">${sale.paymentMode}</span></div>
            </td>
            <td>${itemsHtml}</td>
            <td style="vertical-align: middle;"><span class="lg-badge bg-green">${formatCurrency(finalTotal)}</span></td>
        `;
        tbody.appendChild(tr);
    }
};

const renderAll = () => { renderStats(); renderTable(); };

const updateExportWipeUI = () => {
    const wipeBtn = document.getElementById('btn-wipe');
    if (isExported && sales.length > 0) {
        wipeBtn.disabled = false; wipeBtn.classList.add('enabled');
    } else {
        wipeBtn.disabled = true; wipeBtn.classList.remove('enabled');
    }
};

document.getElementById('btn-export').addEventListener('click', () => {
    if (sales.length === 0) return alert("No data to export!");
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Sr,Timestamp,Customer,Bill No,Payment Mode,Total Sale,Discount,Item Category,Item Subcategory,Vendor,Buy Price,Sell Price,Packaging,Note\n";
    
    sales.forEach((s, i) => {
        const sr = i + 1;
        const cName = s.customerName || `Customer #${sr}`;
        const time = new Date(s.timestamp).toLocaleString().replace(/,/g, '');
        s.items.forEach((it, idx) => {
            const isFirst = idx === 0;
            const row = [
                isFirst ? sr : "", isFirst ? time : "", isFirst ? `"${cName}"` : "", isFirst ? s.billNo : "",
                isFirst ? s.paymentMode : "", isFirst ? s.items.reduce((a, b) => a + b.sell, 0) - s.discount : "",
                isFirst ? s.discount : "", `"${it.cat}"`, `"${it.subcat}"`, `"${it.vendor}"`,
                it.buy, it.sell, `"${it.pkg}"`, `"${it.note}"`
            ];
            csvContent += row.join(",") + "\n";
        });
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Sales_Close_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    isExported = true;
    updateExportWipeUI();
});

document.getElementById('btn-wipe').addEventListener('click', () => {
    if (isExported && confirm("WIPE all data? This cannot be undone.")) {
        sales = []; isExported = false;
        saveState(); resetForm(); updateExportWipeUI();
    }
});

applyTheme();
resetForm();
renderAll();
updateExportWipeUI();

</script>
</body>
</html>
