<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>
    <style>
        :root {
            /* Light Mode */
            --page-bg: #b3b3b8; /* Grayer background outside the app */
            --bg-color: #f0f0f2;
            --card-bg: #ffffff;
            --text-main: #000000; /* Much darker text */
            --text-muted: #3a3a3c; /* Much darker muted text */
            --border-color: #c6c6c8;
            --accent-blue: #0071e3;
            --accent-blue-hover: #0077ed;
            --danger: #ff3b30;
            --shadow: 0 4px 6px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.15);
            --radius: 8px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="dark"] {
            /* Dark Mode */
            --page-bg: #000000;
            --bg-color: #151516;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #d1d1d6;
            --border-color: #38383a;
            --accent-blue: #0a84ff;
            --accent-blue-hover: #409cff;
            --danger: #ff453a;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }

        body {
            background-color: var(--page-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 15px;
            transition: background-color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            background-color: var(--bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* Custom minimal scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        /* Colored Info Rectangles */
        .info-box {
            display: inline-block;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .info-sno { background-color: rgba(142, 142, 147, 0.15); color: var(--text-main); margin-right: 5px; }
        .info-cat { background-color: rgba(0, 113, 227, 0.12); color: var(--accent-blue); margin-right: 5px; }
        .info-date { background-color: rgba(142, 142, 147, 0.12); color: var(--text-muted); }
        .info-amount { background-color: rgba(52, 199, 89, 0.12); color: #208736; font-size: 0.7rem; }
        [data-theme="dark"] .info-amount { color: #32d74b; background-color: rgba(52, 199, 89, 0.18); }

        /* Top Header Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px 12px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .top-left { flex: 1; display: flex; align-items: center; gap: 10px; justify-content: flex-start; }
        .top-center { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: var(--text-main); }
        .top-right { flex: 1; display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        
        .time-display { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }
        .today-sale { font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* Buttons */
        button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--page-bg); }
        button.primary { background-color: var(--accent-blue); color: white; border: none; }
        button.primary:hover { background-color: var(--accent-blue-hover); }
        button.danger { background-color: transparent; color: var(--danger); border-color: var(--danger); }
        button.danger:hover { background-color: rgba(255,59,48,0.1); }
        .icon-btn { font-size: 0.9rem; padding: 4px 6px; border: none; background: transparent; }

        /* Split Layout Settings */
        .main-content {
            display: flex;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
        }

        .left-panel {
            width: 330px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            transition: background-color 0.3s;
        }

        /* Form Card */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        
        .card-header {
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Form Elements */
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; color: var(--text-muted); font-weight: 600; font-size: 0.7rem; }
        input, select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border-color);
            border-radius: 5px; background-color: var(--bg-color); color: var(--text-main);
            font-size: 0.75rem; font-weight: 500; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.2); }
        input::placeholder { color: #8e8e93; font-weight: 400; }

        /* Dynamic Item Rows Layout for Side Panel */
        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }
        
        .form-actions { display: flex; justify-content: space-between; margin-top: 15px; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 8px; border-bottom: 1px solid var(--border-color); font-size: 0.75rem; font-weight: 500; }
        th { color: var(--text-muted); font-weight: 700; font-size: 0.65rem; text-transform: uppercase; background-color: var(--bg-color); position: sticky; top: 0; z-index: 1;}
        .item-list { list-style: none; }
        .item-list li { margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
        .desc-text { color: var(--text-muted); font-size: 0.7rem; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <!-- Left: Sales Total -->
        <div class="top-left">
            <div class="today-sale">
                Today: <span id="todayTotalValue" class="info-box info-amount">₹0.00</span>
                <button type="button" id="toggleSaleBtn" onclick="toggleTodaySale()">Hide</button>
            </div>
        </div>

        <!-- Center: Customer Count -->
        <div class="top-center">
            Today's Customers: &nbsp;<span id="todayCustomerCount" class="info-box info-sno" style="margin:0;">0</span>
        </div>

        <!-- Right: Clock & Theme -->
        <div class="top-right">
            <span class="time-display" id="datetimeDisplay"></span>
            <button type="button" class="icon-btn" onclick="toggleDarkMode()" id="themeIcon">🌙</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="card">
                <div class="card-header">
                    <span id="formTitle">New Sale Entry</span>
                </div>
                
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" placeholder="Leave blank for Auto-Serial" autocomplete="off" autofocus>
                </div>

                <!-- Vendor Selection -->
                <div class="form-group">
                    <label>Vendor</label>
                    <select id="vendorName">
                        <option value="NA">NA</option>
                        <option value="Vendor A">Bhagvat Imitation</option>
                        <option value="Vendor B">Inayat Fashions</option>
                        <option value="Vendor C">Singh Fashion Emproium</option>
                    </select>
                </div>

                <div id="itemsContainer">
                    <!-- Item rows injected here -->
                </div>

                <div class="form-actions">
                    <button type="button" onclick="addItemRow()">+ Add Item</button>
                    <div style="display: flex; gap: 6px;">
                        <button type="button" id="cancelEditBtn" onclick="clearForm()" style="display: none;">Cancel</button>
                        <button type="button" class="primary" id="saveBtn" onclick="saveSale()">Add Sale</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="card-header" style="padding: 12px; margin-bottom: 0; border: none; background: var(--card-bg); position: sticky; top: 0; z-index: 2;">
                <span>Sales Records</span>
                <div>
                    <button type="button" class="danger" onclick="clearAllData()" style="margin-right: 8px;">Clear All Data</button>
                    <button type="button" onclick="exportToExcel()">Export (Excel)</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date & Time</th>
                        <th>Customer</th>
                        <th>Vendor</th>
                        <th>Items Purchased</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    // State Management & Categories
    let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
    let editingId = null;
    let saleVisible = true;

    // Defined Categories
    const subCategories = {
        "RING": ["Anti Tarnish", "Korean", "AD-Cocktail", "AD-Medium", "AD-Small", "Gold -White Stone", "Gold -Red Stone", "Gold -Cocktail", "Gold -Plain"],
        "Pendant": ["Anti-Tarnish", "AD"],
        "Bracelet": ["Anti-Tarnish", "AD", "Anti-Tarnish Chained", "AD Chained"],
        "Earring": ["Korean", "Anti-tarnish", "Hoops", "AD Earrings", "Anti-Tarnish Studs", "General Studs", "AD studs","Gold Studs", "Indo-Western", "Partywear", "Funky"],
        "Chain": ["AT Sleek Snake", "AT Snake", "AT Balls", "Silver", "Micro-Gold 18 Inch 1L" ,"Micro-Gold 18 Inch 2L" ,"Micro-Gold 24 Inch 2L", "Micro-Gold 24 Inch 3L" ,"Men's"],
        "Set": ["Anti-Tarnish", "AD One", "AD 2 Layer", "AD 3 layer", "AD Heavy", "AD choker" ,"Indian Kundan/Polki Stone cut (Small)" ,"Indian Kundan/Polki Stone cut (Big)"],
        "Necklace": ["Anti-Tarnish", "AD"]
    };
    
    const categoriesList = Object.keys(subCategories);

    window.onload = () => {
        updateDateTime();
        setInterval(updateDateTime, 1000);
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeIcon').textContent = '☀️';
        }

        addItemRow(); 
        renderTable();
        calculateTodaySale();
        document.getElementById('customerName').focus();
    };

    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('datetimeDisplay').textContent = now.toLocaleDateString('en-US', options);
    }

    function toggleDarkMode() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            icon.textContent = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            icon.textContent = '☀️';
        }
    }

    function toggleTodaySale() {
        const valSpan = document.getElementById('todayTotalValue');
        const btn = document.getElementById('toggleSaleBtn');
        saleVisible = !saleVisible;
        
        if (saleVisible) {
            calculateTodaySale(); 
            btn.textContent = "Hide";
        } else {
            valSpan.textContent = "****";
            btn.textContent = "Show";
        }
    }

    // Renders the Type Dropdown/Text input dynamically
    function updateSubcatUI(selectElement, selectedSub = '') {
        const category = selectElement.value;
        const descContainer = selectElement.closest('.item-row').querySelector('.desc-wrapper');
        const options = subCategories[category];
        
        if (options && options.length > 0) {
            let selectHTML = `<select class="item-subcat">`;
            options.forEach(opt => {
                selectHTML += `<option value="${opt}" ${selectedSub === opt ? 'selected' : ''}>${opt}</option>`;
            });
            selectHTML += `</select>`;
            descContainer.innerHTML = selectHTML;
        } else {
            descContainer.innerHTML = `<input type="text" class="item-subcat" placeholder="Enter type..." value="${selectedSub}">`;
        }
    }

    // Handles adding the UI row with the updated Grid Layout
    function addItemRow(cat = '', subCat = '', note = '', price = '') {
        if (typeof cat === 'object') { cat = ''; subCat = ''; note = ''; price = ''; } 

        const container = document.getElementById('itemsContainer');
        const rowDiv = document.createElement('div');
        rowDiv.className = 'item-row';

        const defaultCat = cat || categoriesList[0];

        let selectHTML = `<select class="item-category" onchange="updateSubcatUI(this)">`;
        categoriesList.forEach(c => {
            selectHTML += `<option value="${c}" ${defaultCat === c ? 'selected' : ''}>${c}</option>`;
        });
        selectHTML += `</select>`;

        rowDiv.innerHTML = `
            <div class="form-group"><label>Item</label>${selectHTML}</div>
            
            <div class="form-group">
                <label>Type</label>
                <div class="desc-wrapper"></div>
            </div>
            
            <div class="form-group" style="grid-column: span 2;">
                <label>Note (Optional description)</label>
                <input type="text" class="item-note" placeholder="Any extra details..." value="${note}">
            </div>
            
            <div class="form-group">
                <label>Price (₹)</label>
                <!-- step="10" allows jumping by 10s with up/down arrows -->
                <input type="number" class="item-price" placeholder="0" step="10" value="${price}">
            </div>
            
            <div class="form-group" style="display: flex; align-items: flex-end; justify-content: flex-end;">
                <button type="button" class="danger" onclick="this.parentElement.parentElement.remove()">Remove</button>
            </div>
        `;
        
        container.appendChild(rowDiv);
        
        // Trigger UI update immediately to load specific sub-types
        updateSubcatUI(rowDiv.querySelector('.item-category'), subCat);
    }

    function clearForm() {
        document.getElementById('customerName').value = '';
        document.getElementById('vendorName').value = 'Self'; // Reset vendor
        document.getElementById('itemsContainer').innerHTML = '';
        addItemRow();
        editingId = null;
        
        document.getElementById('formTitle').textContent = "New Sale Entry";
        document.getElementById('saveBtn').textContent = "Add Sale";
        document.getElementById('cancelEditBtn').style.display = "none";
        
        document.getElementById('customerName').focus();
    }

    function getNextSerial() {
        if (salesData.length === 0) return 1;
        const maxSerial = Math.max(...salesData.map(s => s.serialNo || 0));
        return maxSerial + 1;
    }

    function saveSale() {
        const nameInput = document.getElementById('customerName').value.trim();
        const vendorInput = document.getElementById('vendorName').value;
        
        let currentSerialNo;
        if (editingId) {
            const existing = salesData.find(s => s.id === editingId);
            currentSerialNo = existing.serialNo || getNextSerial();
        } else {
            currentSerialNo = getNextSerial(); 
        }

        let customerName = nameInput;
        if (customerName === "") {
            customerName = `Customer #${currentSerialNo}`;
        }

        const rows = document.querySelectorAll('.item-row');
        let items = [];
        let total = 0;

        rows.forEach(row => {
            const category = row.querySelector('.item-category').value;
            const subCategoryNode = row.querySelector('.item-subcat');
            const subCategory = subCategoryNode ? subCategoryNode.value.trim() : '';
            const note = row.querySelector('.item-note').value.trim();
            const priceVal = parseFloat(row.querySelector('.item-price').value);
            
            if (!isNaN(priceVal) && priceVal > 0) {
                items.push({ category, subCategory, note, price: priceVal });
                total += priceVal;
            }
        });

        if (items.length === 0) {
            alert("Please add at least one item with a valid price.");
            return;
        }

        const saleRecord = {
            id: editingId ? editingId : Date.now(),
            serialNo: currentSerialNo,
            timestamp: editingId ? salesData.find(s => s.id === editingId).timestamp : new Date().toISOString(),
            customerName,
            vendorName: vendorInput,
            items,
            total
        };

        if (editingId) {
            const index = salesData.findIndex(s => s.id === editingId);
            if (index !== -1) salesData[index] = saleRecord;
        } else {
            salesData.unshift(saleRecord);
        }

        localStorage.setItem('salesData', JSON.stringify(salesData));
        clearForm();
        renderTable();
        calculateTodaySale();
    }

    function editSale(id) {
        const sale = salesData.find(s => s.id === id);
        if (!sale) return;

        document.getElementById('customerName').value = sale.customerName;
        document.getElementById('vendorName').value = sale.vendorName || 'Self';
        document.getElementById('itemsContainer').innerHTML = '';
        
        sale.items.forEach(item => {
            // Handles backward compatibility if subCategory is missing from old saves
            const subCatData = item.subCategory !== undefined ? item.subCategory : (item.desc || '');
            const noteData = item.note || '';
            addItemRow(item.category, subCatData, noteData, item.price);
        });

        editingId = id;
        document.getElementById('formTitle').textContent = `Edit Sale Entry #${sale.serialNo || 'Old'}`;
        document.getElementById('saveBtn').textContent = "Update Sale";
        document.getElementById('cancelEditBtn').style.display = "inline-block";
        
        document.querySelector('.left-panel').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSale(id) {
        if(confirm("Are you sure you want to delete this entry?")) {
            salesData = salesData.filter(s => s.id !== id);
            localStorage.setItem('salesData', JSON.stringify(salesData));
            
            if(editingId === id) clearForm();
            
            renderTable();
            calculateTodaySale();
        }
    }

    function clearAllData() {
        if(confirm("🚨 WARNING: Are you sure you want to delete ALL sales data? This cannot be undone!")) {
            if(confirm("Are you absolutely sure? All records will be permanently lost.")) {
                salesData = [];
                localStorage.removeItem('salesData');
                
                clearForm();
                renderTable();
                calculateTodaySale();
                
                alert("All data has been cleared.");
            }
        }
    }

    function renderTable() {
        const tbody = document.getElementById('salesTableBody');
        tbody.innerHTML = '';

        salesData.forEach(sale => {
            const dateObj = new Date(sale.timestamp);
            const dateStr = dateObj.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const serialDisplay = sale.serialNo ? sale.serialNo : '-';

            let itemsHTML = '<ul class="item-list">';
            sale.items.forEach(item => {
                // Formatting Subcategory + Note
                const subCatData = item.subCategory !== undefined ? item.subCategory : (item.desc || '');
                const noteData = item.note || '';
                
                // Construct the "Pendant > anti-tarnish" tag
                const catString = subCatData ? `${item.category} > ${subCatData}` : item.category;
                const noteStr = noteData ? `<span class="desc-text">(${noteData})</span>` : '';

                itemsHTML += `<li>
                    <span class="info-box info-cat">${catString}</span>
                    ${noteStr}
                    <span class="info-box info-amount">₹${item.price.toFixed(2)}</span>
                </li>`;
            });
            itemsHTML += '</ul>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="info-box info-sno">#${serialDisplay}</span></td>
                <td><span class="info-box info-date">${dateStr}</span></td>
                <td style="font-weight: 700; font-size: 0.8rem;">${sale.customerName}</td>
                <td><span class="info-box" style="background-color: rgba(142, 142, 147, 0.15); color: var(--text-main);">${sale.vendorName || 'Self'}</span></td>
                <td>${itemsHTML}</td>
                <td><span class="info-box info-amount" style="font-size: 0.8rem;">₹${sale.total.toFixed(2)}</span></td>
                <td>
                    <button type="button" onclick="editSale(${sale.id})" style="margin-bottom: 4px;">Edit</button><br>
                    <button type="button" class="danger" onclick="deleteSale(${sale.id})">Del</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calculateTodaySale() {
        const today = new Date().toLocaleDateString();
        let total = 0;
        let customerCount = 0;
        
        salesData.forEach(sale => {
            const saleDate = new Date(sale.timestamp).toLocaleDateString();
            if (saleDate === today) {
                total += sale.total;
                customerCount++;
            }
        });

        // Update customer count
        const countElement = document.getElementById('todayCustomerCount');
        if (countElement) countElement.textContent = customerCount;

        // Update total money if visible
        const valSpan = document.getElementById('todayTotalValue');
        if (saleVisible) {
            valSpan.textContent = `₹${total.toFixed(2)}`;
        } else {
            valSpan.textContent = "****";
        }
    }

    function exportToExcel() {
        if(salesData.length === 0) {
            alert("No data to export!");
            return;
        }

        let csvContent = "S.No.,Date,Time,Customer Name,Vendor,Item Category,Item Type,Extra Note,Item Price,Sale Total\n";

        salesData.forEach(sale => {
            const dateObj = new Date(sale.timestamp);
            const date = dateObj.toLocaleDateString();
            const time = dateObj.toLocaleTimeString();
            const customer = `"${sale.customerName.replace(/"/g, '""')}"`;
            const vendor = `"${(sale.vendorName || 'Self').replace(/"/g, '""')}"`;
            const total = sale.total.toFixed(2);
            const sno = sale.serialNo || '';

            sale.items.forEach((item, index) => {
                const subCatData = item.subCategory !== undefined ? item.subCategory : (item.desc || '');
                const noteData = item.note || '';

                const cat = item.category;
                const type = `"${subCatData.replace(/"/g, '""')}"`;
                const note = `"${noteData.replace(/"/g, '""')}"`;
                const price = item.price.toFixed(2);
                
                const displayTotal = (index === sale.items.length - 1) ? total : "";
                csvContent += `${sno},${date},${time},${customer},${vendor},${cat},${type},${note},${price},${displayTotal}\n`;
            });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `Sales_Export_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
