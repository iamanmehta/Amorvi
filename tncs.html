<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amorvi - Terms and Conditions</title>
    
    <!-- Import Montserrat Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* General Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        /* Responsive Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Brand Name */
        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 8px; /* Increased letter spacing */
            color: #1a1a1a;
            text-transform: uppercase;
            margin-bottom: 5px;
            margin-left: 8px; /* Offsets the text alignment issue caused by trailing letter-spacing */
        }

        /* Typography */
        h1 {
            font-size: 1.4rem;
            color: #7f8c8d;
            font-weight: normal;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }
        
        .important-terms {
            background-color: #fff3f3;
            border-left: 4px solid #e74c3c;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 4px;
        }

        .important-terms ul {
            list-style-type: none;
        }

        .important-terms li {
            margin-bottom: 15px;
            font-weight: 600;
            color: #c0392b;
            font-size: 1.1rem;
        }

        .important-terms li:last-child {
            margin-bottom: 0;
        }

        .important-terms li::before {
            content: "⚠️ ";
        }

        p {
            margin-bottom: 15px;
        }

        /* Social Links Section */
        .social-section {
            margin-top: 40px;
            text-align: center;
            border-top: 2px solid #eee;
            padding-top: 25px;
        }

        .social-section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #7f8c8d;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 25px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 30px;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 200px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-whatsapp {
            background-color: #25D366;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .brand-name {
                font-size: 1.8rem;
                letter-spacing: 5px; /* Increased mobile letter spacing */
                margin-left: 5px;
            }
            h1 {
                font-size: 1.2rem;
            }
            .important-terms li {
                font-size: 1rem;
            }
            .btn-container {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Brand Name Added Here -->
        <div class="brand-name">Amorvi</div>
        
        <h1>Terms and Conditions of Purchase</h1>
        
        <p>Thank you for shopping shop with us.</p>

        <!-- Major Points Section -->
        <div class="important-terms">
            <ul>
                <li>Goods once sold will not be returned and no refund will be given in any case.</li>
                <li>No Exchange without bill within 2 days of purchase.</li>
            </ul>
        </div>

      <h3>Shop & Explore more</h3>

        <!-- Social & Contact Links -->
        <div class="social-section">
            <h2>Explore More & Contact Us</h2>
            <div class="btn-container">
                <!-- Replace 'YOUR_USERNAME' with your actual Instagram handle -->
                <a href="https://wa.me/c/+919992206060" target="_blank" class="btn btn-whatsapp">
                    Our Catalog
                </a>
                <a href="https://instagram.com/amorvi.in" target="_blank" class="btn btn-instagram">
                    Visit our Instagram
                </a>
                
                <!-- Replace 'YOUR_PHONE_NUMBER' with your WhatsApp Business number (include country code, no + sign) -->
                <!-- Example: https://wa.me/c/919876543210 -->
                
            </div>
        </div>
    </div>

</body>
</html>
